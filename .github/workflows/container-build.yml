name: Container build validation

on:
  pull_request:
    paths: ['Dockerfile', 'compose*.yaml', '.dockerignore', '.github/workflows/**', 'pyproject.toml', 'uv.lock', 'backends/paddleocr_runtime/**', 'scripts/deployment/verify_container_image.py', 'scripts/deployment/prepare_hosted_container_runner.sh', 'src/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [api, parsing]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare hosted runner storage for GPU image
        if: matrix.target == 'parsing'
        run: bash scripts/deployment/prepare_hosted_container_runner.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          tags: multimodal-document-${{ matrix.target }}:ci
      - name: Verify parsing image runtime and API
        if: matrix.target == 'parsing'
        run: python scripts/deployment/verify_container_image.py multimodal-document-parsing:ci
