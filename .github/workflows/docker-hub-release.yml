name: Publish parsing image to Docker Hub

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (for example 0.1.0-rc1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/continuous-integration.yml
  publish:
    permissions:
      contents: write
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: docker-hub
    steps:
      - uses: actions/checkout@v4
      - name: Validate publishing configuration
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          test -n "$USERNAME"
          echo "$IMAGE" | grep -Eq '^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$'
      - name: Require an already-created public Docker Hub repository
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          python - <<'PYTHON'
          import json, os, urllib.request
          namespace, name = os.environ['IMAGE'].split('/')
          url = f'https://hub.docker.com/v2/namespaces/{namespace}/repositories/{name}'
          with urllib.request.urlopen(url, timeout=30) as response:
              repository = json.load(response)
          assert repository.get('is_private') is False, 'Docker Hub repository must be public'
          PYTHON
      - name: Prepare hosted runner storage for GPU image
        run: bash scripts/deployment/prepare_hosted_container_runner.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha
      - name: Build release candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: parsing
          build-args: NATIVE_BUILD_JOBS=4
          platforms: linux/amd64
          load: true
          tags: parser-release:check
          cache-from: type=gha,scope=parsing
          cache-to: type=gha,mode=max,scope=parsing
      - name: Smoke-test the actual image (no model downloads or cloud calls)
        run: python scripts/deployment/verify_container_image.py parser-release:check
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested image with dependency and build metadata
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: parsing
          build-args: NATIVE_BUILD_JOBS=4
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=parsing
          provenance: mode=max
          sbom: true
      - name: Record release digest
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Synchronize Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE }}
          readme-filepath: docs/docker/docker-hub-overview.md
          short-description: Quantized dots.mocr GPU PDF/DOCX parsing, structured exports and cloud visual enrichment
      - name: Verify anonymous access to published digest
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          docker --config "$RUNNER_TEMP/anonymous-docker" manifest inspect "$IMAGE@$DIGEST" > /dev/null
      - name: Create a GitHub release for the published image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          version="${TAG_INPUT:-${GITHUB_REF_NAME#v}}"
          python - <<'PYTHON'
          import json, os, pathlib
          record = {'image': os.environ['IMAGE'], 'digest': os.environ['DIGEST'],
                    'source_revision': os.environ['GITHUB_SHA'],
                    'workflow': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          pathlib.Path('container-release.json').write_text(json.dumps(record, indent=2)+'\n')
          pathlib.Path('release-notes.md').write_text(
              f"Public GPU parsing image: `{record['image']}@{record['digest']}`.\n\n"
              f"Built from `{record['source_revision']}` after source/browser CI and image smoke tests. "
              'Includes SBOM and build provenance. Gemma executes through Ollama Cloud; its weights are not bundled.\n\n'
              '[Docker setup](https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/main/docs/docker/README.md)')
          PYTHON
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'Existing release preserved.'
          else
            options=()
            if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/v$version" -f "sha=$GITHUB_SHA" >/dev/null
            fi
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$version" --jq .sha)
            test "$tag_commit" = "$GITHUB_SHA"
            gh release create "v$version" container-release.json \
              --verify-tag --title "Document parsing pipeline $version" \
              --notes-file release-notes.md "${options[@]}"
          fi
