[project]
name = "unlimited-ocr-2-inference-runtime"
version = "0.1.0"
description = "Isolated experimental GPU runtime for Unlimited-OCR 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.52.1",
    "huggingface-hub==0.36.0",
    "tokenizers==0.21.4",
    "accelerate==1.10.1",
    "bitsandbytes==0.46.1",
    "addict==2.4.0",
    "einops==0.8.2",
    "easydict==1.13",
    "pillow>=11,<13",
    "matplotlib>=3.10,<4",
    "requests>=2.32,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
