[project]
name = "paddleocr-inference-runtime"
version = "0.1.0"
description = "Isolated GPU inference environment for PaddleOCR-VL-1.6"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddleocr[doc-parser]==3.6.0",
    "paddlepaddle-gpu==3.2.1",
]

[tool.uv]
package = false

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cuda126" }

[[tool.uv.index]]
name = "paddle-cuda126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
