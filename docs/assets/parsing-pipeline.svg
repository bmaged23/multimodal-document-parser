<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810"><title>Verified document parsing pipeline</title><rect width="1600" height="810" fill="#f3f7f8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e71"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif" fill="#173441"><text x="40" y="65" font-size="31" font-weight="700">HOW THE PARSING PIPELINE WORKS</text><text x="40" y="112" font-size="22">Deployed PaddleOCR path: local GPU and optional Ollama Cloud visual descriptions</text><polyline points="250,260 305,260" fill="none" stroke="#087e71" stroke-width="4" marker-end="url(#arrow)"/><polyline points="535,260 590,260" fill="none" stroke="#087e71" stroke-width="4" marker-end="url(#arrow)"/><polyline points="825,260 880,260" fill="none" stroke="#087e71" stroke-width="4" marker-end="url(#arrow)"/><polyline points="1120,260 1260,260" fill="none" stroke="#087e71" stroke-width="4" marker-end="url(#arrow)"/><polyline points="1000,335 1000,470" fill="none" stroke="#466bad" stroke-width="4" marker-end="url(#arrow)"/><polyline points="1245,565 1410,565 1410,335" fill="none" stroke="#466bad" stroke-width="4" marker-end="url(#arrow)"/><polyline points="707,335 707,410 550,410 550,495" fill="none" stroke="#5e7685" stroke-width="4" marker-end="url(#arrow)"/><polyline points="870,570 765,570" fill="none" stroke="#5e7685" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="190" width="210" height="145" rx="17" fill="white" stroke="#087e71" stroke-width="3"/><text x="56" y="237" font-size="20" font-weight="700">PDF or DOCX</text><text x="56" y="274" font-size="16">PDF input</text><text x="56" y="299" font-size="16">DOCX via LibreOffice</text><rect x="305" y="190" width="230" height="145" rx="17" fill="white" stroke="#087e71" stroke-width="3"/><text x="321" y="237" font-size="20" font-weight="700">Render pages</text><text x="321" y="274" font-size="16">Page images + identity</text><text x="321" y="299" font-size="16">Page geometry retained</text><rect x="590" y="190" width="235" height="145" rx="17" fill="white" stroke="#087e71" stroke-width="3"/><text x="606" y="237" font-size="20" font-weight="700">PaddleOCR-VL-1.6</text><text x="606" y="274" font-size="16">GPU text + layout</text><text x="606" y="299" font-size="16">Tables + visual regions</text><rect x="880" y="190" width="240" height="145" rx="17" fill="white" stroke="#087e71" stroke-width="3"/><text x="896" y="237" font-size="20" font-weight="700">Normalize + crop</text><text x="896" y="274" font-size="16">Canonical JSON + boxes</text><text x="896" y="299" font-size="16">Page and visual assets</text><rect x="1260" y="190" width="300" height="145" rx="17" fill="white" stroke="#087e71" stroke-width="3"/><text x="1276" y="237" font-size="20" font-weight="700">Review + export</text><text x="1276" y="274" font-size="16">JSON · Markdown · HTML</text><text x="1276" y="299" font-size="16">Source PDF + linked assets</text><rect x="335" y="495" width="430" height="155" rx="17" fill="white" stroke="#5e7685" stroke-width="3"/><text x="351" y="542" font-size="20" font-weight="700">Keep the evidence</text><text x="351" y="579" font-size="16">Raw OCR / VLM replies + logs</text><text x="351" y="604" font-size="16">Failures and partial runs retained</text><rect x="870" y="470" width="375" height="190" rx="17" fill="white" stroke="#466bad" stroke-width="3"/><text x="886" y="517" font-size="20" font-weight="700">Optional visual enrichment</text><text x="886" y="554" font-size="16">Crops + page context</text><text x="886" y="579" font-size="16">Gemma4:31b via Ollama Cloud</text><text x="886" y="604" font-size="16">Schema-check replies; keep provenance</text><text x="886" y="629" font-size="16">Generated descriptions + chart values</text><text x="40" y="747" font-size="19">Optional cloud branch; raw replies and failures retained. Source-reviewed evaluation repairs are separate.</text></g></svg>